<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}My Website{% endblock %}</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/buttons.css">
  <link rel="stylesheet" href="/static/css/navbars.css">
  {% block extra_css %}{% endblock %}

</head>
<body>
    <div class="d-flex justify-content-between align-items-center px-4 py-2 shadow-sm" style="background-color: #2c2f33; color: white;">
        <!-- Αριστερά: Brand -->
        <div>
            <a href="/" class="brand text-primary fw-bold fs-4 text-decoration-none">MyFlaskApp</a>
        </div>

        <!-- Κέντρο: Κεντρικά κουμπιά -->
        {% if  user.is_authenticated %}
        <div class="d-flex gap-3 justify-content-center align-items-center">
            <a class="nav-link btn btn-menu" href="/">
                <i class="fas fa-dumbbell"></i> Book Training
            </a>

            <a class="nav-link btn btn-menu" href="/users">
                <i class="fas fa-users"></i> Users
            </a>

            <a class="nav-link btn btn-menu" href="/trainers-book">
                <i class="fas fa-briefcase"></i> Trainers Schedule
            </a>

            <a class="nav-link btn btn-menu" href="/base">
                <i class="fas fa-briefcase"></i> Base
            </a>
        </div>
        {% endif %}

        <!-- Δεξιά: Contact + About Us -->
        <div class="d-flex gap-3">
            <a class="nav-link btn btn-menu" href="/">
                <i class="fas fa-envelope"></i> Contact
            </a>

            <a class="nav-link btn btn-menu" href="/">
                <i class="fas fa-info-circle"></i> About Us
            </a>

            {% if  user.is_authenticated %}
            <a class="nav-link btn-menu btn-logout" href="/logout">
                <i class="fas fa-sign-out-alt"></i> Logout ({{ user.email}}) 
            </a>
            {% endif %}

        </div>
    </div>

  <main>
    {% block content %}
    <!-- Default content goes here -->
    {% endblock %}
  </main>

    <script>
      function toggleMenu() {
          const menu = document.getElementById('nav-menu');
          if (menu.style.display === 'flex') {
              menu.style.display = 'none';
          } else {
              menu.style.display = 'flex';
          }
      }
  </script>
  {% block extra_scripts %}{% endblock %}

</body>
</html>
