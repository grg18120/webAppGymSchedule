
<!-- templates/navbar.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-somehash" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 10px 20px;
        }

        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 15px;
        }

        .navbar ul li {
            position: relative;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
        }

        .navbar a:hover {
            background-color: #555;
            border-radius: 5px;
        }

        .navbar .brand {
            font-size: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Dropdown Styling */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #444;
            min-width: 160px;
            z-index: 1;
            border-radius: 5px;
        }

        .dropdown-content a {
            color: white;
            padding: 10px 16px;
            display: block;
            text-decoration: none;
        }

        .dropdown-content a:hover {
            background-color: #555;
        }

        .navbar ul li:hover .dropdown-content {
            display: block;
        }

        /* Mobile Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background-color: white;
        }

        @media (max-width: 768px) {
            .navbar ul {
                display: none;
                flex-direction: column;
                width: 100%;
            }

            .navbar ul li {
                width: 100%;
                text-align: center;
            }

            .navbar ul li a {
                display: block;
                width: 100%;
            }

            .hamburger {
                display: flex;
            }
        }

        /* Logout Button Styling */
        .btn-outline-danger {
            transition: all 0.3s ease;
        }

        .btn-outline-danger:hover {
            background-color: #dc3545;
            color: white;
            border-color: #dc3545;
        }


    </style>
</head>
<body>

    <!-- <header class="bg-primary text-white text-center py-3">
        <h1>Welcome to MyFlaskApp</h1>
    </header> -->


    <div class="d-flex justify-content-between align-items-center px-4 py-2 shadow-sm" style="background-color: #2c2f33; color: white;">
        <!-- Αριστερά: Brand -->
        <div>
            <a href="/" class="brand text-primary fw-bold fs-4 text-decoration-none">MyFlaskApp</a>
        </div>

        <!-- Κέντρο: Κεντρικά κουμπιά -->
        {% if  user.is_authenticated %}
        <div class="d-flex gap-3 justify-content-center align-items-center">
            <a class="nav-link btn btn-outline-primary" href="/" style="border-radius: 20px; padding: 6px 18px;">
                <i class="fas fa-dumbbell"></i> Book Training
            </a>

            <a class="nav-link btn btn-outline-primary" href="/users" style="border-radius: 20px; padding: 6px 18px;">
                <i class="fas fa-users"></i> Users
            </a>

            <a class="nav-link btn btn-outline-primary" href="/trainers-book" style="border-radius: 20px; padding: 6px 18px;">
                <i class="fas fa-running"></i><i class="fas fa-dumbbell"></i> Trainers
            </a>
        </div>
        {% endif %}

        <!-- Δεξιά: Contact + About Us -->
        <div class="d-flex gap-3">
            <a class="nav-link btn btn-outline-primary" href="/" style="border-radius: 20px; padding: 6px 18px;">
                <i class="fas fa-envelope"></i> Contact
            </a>

            <a class="nav-link btn btn-outline-primary" href="/" style="border-radius: 20px; padding: 6px 18px;">
                <i class="fas fa-info-circle"></i> About Us
            </a>

            {% if  user.is_authenticated %}
            <a class="nav-link btn btn-outline-danger" href="/logout" style="border-radius: 20px; padding: 6px 18px;">
                <i class="fas fa-sign-out-alt"></i> Logout ({{ user.email}}) 
            </a>
            {% endif %}

        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('nav-menu');
            if (menu.style.display === 'flex') {
                menu.style.display = 'none';
            } else {
                menu.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
