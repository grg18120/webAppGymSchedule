<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainers</title>
    <!-- <link rel="stylesheet" href="/static/css/style.css"> -->

    <style>

    body {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed; 
        background-color: aliceblue;
    }

    </style>

</head>

<body>
    {% include 'base_up_menu.html' %}

    <form method="POST" id="date-form">
        <div class="row">
            <div class="col-auto">
                <label for="month-select" class="form-label">Μήνας</label>
                <select name="month" class="form-select" id="month-select" required>
                    <option value="" disabled {% if not selected_month %}selected{% endif %}>Επιλέξτε μήνα</option>
                    {% set months = ['Ιανουάριος', 'Φεβρουάριος', 'Μάρτιος', 'Απρίλιος', 'Μάιος', 'Ιούνιος',
                                    'Ιούλιος', 'Αύγουστος', 'Σεπτέμβριος', 'Οκτώβριος', 'Νοέμβριος', 'Δεκέμβριος'] %}
                    {% for i in range(1, 13) %}
                        <option value="{{ i }}" {% if selected_month == i %}selected{% endif %}>{{ months[i - 1] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-auto">
                <label for="year-select" class="form-label">Έτος</label>
                <select name="year" class="form-select" id="year-select" required>
                    <option value="" disabled {% if not selected_year %}selected{% endif %}>Επιλέξτε έτος</option>
                    {% for y in range(current_date.year - 5, current_date.year + 2) %}
                        <option value="{{ y }}" {% if selected_year == y %}selected{% endif %}>{{ y }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Υποβολή</button>
    </form>

    <!-- Προβολή ημερομηνίας -->
    <div class="mt-3">
        <strong>Επιλεγμένη ημερομηνία:</strong>
        <span id="display-date"></span>
    </div>

    <script>
        const monthSelect = document.getElementById("month-select");
        const yearSelect = document.getElementById("year-select");
        const display = document.getElementById("display-date");

        function updateDateDisplay() {
            const month = monthSelect.value;
            const year = yearSelect.value;
            if (month && year) {
                const date = new Date(year, month - 1, 1);  // JS months are 0-indexed
                const formatter = new Intl.DateTimeFormat('el-GR', { month: 'long', year: 'numeric' });
                display.textContent = formatter.format(date);
            } else {
                display.textContent = "Καμία επιλογή";
            }
        }

        monthSelect.addEventListener("change", updateDateDisplay);
        yearSelect.addEventListener("change", updateDateDisplay);

        // Αρχική εμφάνιση
        updateDateDisplay();
    </script>
</body>


</html>
