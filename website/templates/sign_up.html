{% extends "base.html" %}
{% block title %}Sign up · Gym Sessions{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="inputs-card">
    <h1 class="h3 text-center mb-2">Create a client account</h1>
    <p class="text-center text-muted">Instructors and admins are created by an administrator.</p>
    <form method="POST" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control tap-target" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label for="name_first" class="form-label">First name</label>
        <input type="text" class="form-control tap-target" id="name_first" name="name_first" autocomplete="given-name" required>
      </div>
      <div class="mb-3">
        <label for="name_last" class="form-label">Last name</label>
        <input type="text" class="form-control tap-target" id="name_last" name="name_last" autocomplete="family-name" required>
      </div>
      <div class="mb-3">
        <label for="passwd" class="form-label">Password</label>
        <input type="password" class="form-control tap-target" id="passwd" name="passwd" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="mb-3">
        <label for="passwd_conf" class="form-label">Confirm password</label>
        <input type="password" class="form-control tap-target" id="passwd_conf" name="passwd_conf" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="mb-3">
        <label for="date_birth" class="form-label">Date of birth (optional)</label>
        <input type="date" class="form-control tap-target" id="date_birth" name="date_birth">
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address (optional)</label>
        <input type="text" class="form-control tap-target" id="address" name="address" autocomplete="street-address">
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary tap-target">Create account</button>
      </div>
    </form>
    <p class="text-center mt-3 mb-0">
      Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
