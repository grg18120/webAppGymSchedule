{% extends "base.html" %}
{% block title %}Log in · Gym Sessions{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="inputs-card">
    <h1 class="h3 text-center mb-4">Log in</h1>
    <form method="POST" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control tap-target" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control tap-target" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary tap-target">Log in</button>
      </div>
    </form>
    {% include '_demo_accounts.html' %}
  </div>
</div>
{% endblock %}
