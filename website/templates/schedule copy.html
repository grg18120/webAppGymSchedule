<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toggle Bookable Dates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        .card {
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .btn-toggle span.spinner-border {
            display: none;
        }

        .btn-toggle.loading span.label {
            display: none;
        }

        .btn-toggle.loading span.spinner-border {
            display: inline-block;
        }
    </style>
</head>
<body class="bg-light">

{% include 'base_up_menu.html' %}

<div class="container py-4">
    <h2 class="mb-4 text-center">Schedule</h2>

    <form method="get" action="/schedule" class="row g-2 justify-content-center mb-4">
        <div class="col-auto">
            <select name="month" class="form-select" id="month-select" required>
                <option value="" disabled {% if not selected_month %}selected{% endif %}>Choose month</option>
                {% for m in range(1, 13) %}
                    <option value="{{ m }}" {% if selected_month == m %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-auto">
            <select name="year" class="form-select" id="year-select" required>
                <option value="" disabled {% if not selected_year %}selected{% endif %}>Choose year</option>
                {% for y in range(current_date.year - 2, current_date.year + 3) %}
                    <option value="{{ y }}" {% if selected_year == y %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filter</button>
        </div>

        {% if selected_month and selected_year %}
        <div class="col-auto">
            <button
                type="button"
                class="btn btn-success"
                onclick="activateAllDays({{ selected_month }}, {{ selected_year }})"
                id="btn-all-inactive">
                Activate All Days 
            </button>

            <button
                type="button"
                class="btn btn-danger"
                onclick="inactivateAllDays({{ selected_month }}, {{ selected_year }})"
                id="btn-all-active">
                de-Activate All Days 
            </button>
        </div>
        {% endif %}
    </form>



    <div class="row g-3">
        {% for date in date_list %}
            <div class="col-md-4 col-lg-3">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ date.date.strftime('%A') }}</h5>
                        <p class="card-text text-muted">{{ date.date.strftime('%d %B %Y') }}</p>
                        <button
                            class="btn btn-toggle {% if date.date_bookable %}btn-success{% else %}btn-danger{% endif %}"
                            id="btn-{{ date.id }}"
                            onclick="toggleBookDay({{ date.id }})"
                            {% if date.date < current_date %}disabled{% endif %}>
                            <span class="label">
                                {% if date.date_bookable %}✔ Active{% else %}✖ Inactive{% endif %}
                            </span>
                            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

<!-- Bootstrap Confirmation Modal -->
<div class="modal fade" id="toggleConfirmModal" tabindex="-1" aria-labelledby="toggleConfirmLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title" id="toggleConfirmLabel">Confirm Action</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to toggle all days for <strong id="confirm-month-year"></strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning" id="confirmToggleBtn">Yes, Toggle</button>
      </div>
    </div>
  </div>
</div>

<script>
    function toggleBookDay(scheduleDateId) {
        const btn = document.getElementById('btn-' + scheduleDateId);
        btn.classList.add('loading');

        $.post('/schedule/toggle_day', { schedule_date_id: scheduleDateId }, function(response) {
            if (response.success) {
                const label = btn.querySelector('.label');
                if (response.status === 'active') {
                    btn.classList.remove('btn-danger');
                    btn.classList.add('btn-success');
                    label.textContent = "✔ Active";
                } else {
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-danger');
                    label.textContent = "✖ Inactive";
                }
            } else {
                alert("Error: " + response.message);
            }
        }).fail(function() {
            alert("Failed to toggle status.");
        }).always(function() {
            btn.classList.remove('loading');
        });
    }

    function activateAllDays(month, year) {
        if (!confirm("Are you sure you want to activate all days?")) return;

        const btn = document.getElementById("btn-all-active");
        btn.disabled = true;
        btn.textContent = "Activating...";

        fetch(`/schedule/activate_all_days?month=${month}&year=${year}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload();
            } else {
                console.error(data.message || "Activation failed.");
            }
        })
        .catch(error => {
            console.error("Error activating all days:", error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = "Activate All Days";
        });
    }

    function inactivateAllDays(month, year) {
        if (!confirm("Are you sure you want to inactivate all days?")) return;

        const btn = document.getElementById("btn-all-inactive");
        btn.disabled = true;
        btn.textContent = "Inactivating...";

        fetch(`/schedule/inactivate_all_days?month=${month}&year=${year}`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                location.reload();
            } else {
                console.error(data.message || "Inactivation failed.");
            }
        })
        .catch(error => {
            console.error("Error inactivating all days:", error);
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = "Inactivate All Days";
        });
    }
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
